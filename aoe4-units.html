<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Age of Empires IV ユニット一覧</title>
<style>
:root{
  --bg:#100e0b; --panel:#1b1713; --panel2:#241f19; --line:#372f26;
  --fg:#ece4d7; --dim:#9b8e79; --gold:#d8b06a; --gold2:#f0d49a;
  --row-a:#141211; --row-b:#1e1a16; --hover:#2b2318;
  --a1:#7fae98; --a2:#78a3d4; --a3:#bf90da; --a4:#dfae5c;
  --food:#e08a70; --wood:#b58a5c; --gcol:#e0c469; --stone:#93a0ab;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-size:13px;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column}
header{padding:12px 16px 9px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#241e17,#15120e)}
h1{margin:0;font-size:17px;letter-spacing:.05em;color:var(--gold2);font-weight:600}
.sub{color:var(--dim);font-size:11px;margin-top:3px}
.sub a{color:var(--gold)}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;
  display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp .t{color:var(--dim);font-size:11px;letter-spacing:.04em}
.chip{background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:3px 10px;border-radius:13px;cursor:pointer;font-size:12px;line-height:1.4}
.chip:hover{border-color:var(--gold);color:var(--fg)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1d1710;font-weight:600}
select,input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  padding:4px 8px;border-radius:6px;font-size:12px}
input[type=search]{width:170px}
.count{margin-left:auto;color:var(--dim);font-size:11px}
.wrap{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:auto;
  font-variant-numeric:tabular-nums;white-space:nowrap}
th.fill,td.fill{width:100%;padding:0;border-bottom:1px solid #221c16;background:var(--rb)}
thead th.fill{background:#2a231b;cursor:default}
thead th{position:sticky;top:0;z-index:30;background:#2a231b;color:var(--gold);
  font-size:11px;font-weight:600;letter-spacing:.03em;padding:7px 10px;text-align:right;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
thead th:hover{color:var(--gold2)}
thead th.sorted{color:#fff}
thead th.sorted::after{content:" ▼";font-size:8px}
thead th.sorted.asc::after{content:" ▲"}
th.l,td.l{text-align:left}
tbody td{padding:5px 10px;text-align:right;background:var(--rb);border-bottom:1px solid #221c16}
tr.odd{--rb:var(--row-a)} tr.even{--rb:var(--row-b)}
tbody tr:hover{--rb:var(--hover)}
tbody tr.open{--rb:#332a1d}
.sk{position:sticky;left:0;z-index:10}
.sk2{position:sticky;left:38px;z-index:10;border-right:1px solid var(--line)}
thead .sk{z-index:40} thead .sk2{z-index:40;background:#2a231b}
.ic{width:24px;height:24px;display:block;border-radius:4px}
.nm{font-weight:600;color:#fff}
.uq{color:var(--gold);font-size:9px;margin-left:4px;vertical-align:2px}
.age{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;
  font-size:11px;font-weight:700;color:#171310}
.age.v1{background:var(--a1)}.age.v2{background:var(--a2)}.age.v3{background:var(--a3)}.age.v4{background:var(--a4)}
.cat{color:var(--dim);font-size:11px}
.civ{color:#c3b49a;font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.civ.all{color:var(--gold)}
.z{color:#4a4238}
.bar1{position:relative}
.bar1 i{position:absolute;right:0;top:0;bottom:0;background:rgba(90,140,185,.18);pointer-events:none}
.bar2 i{background:rgba(190,95,70,.18)}
.cost span{margin-left:7px}
.cost span:first-child{margin-left:0}
.food{color:var(--food)}.wood{color:var(--wood)}.gold{color:var(--gcol)}.stone{color:var(--stone)}
tr.sec td{background:#0b0908;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.12em;text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);
  position:sticky;top:31px;z-index:20}
tr.det td{white-space:normal;text-align:left;background:#0e0c0a;color:var(--dim);font-size:12px;padding:9px 14px 11px 48px}
tr.det b{color:var(--fg)}
tr.det .wt{margin-top:6px;border-collapse:collapse;width:auto}
tr.det .wt td,tr.det .wt th{padding:2px 14px 2px 0;background:none;border:none;text-align:left;
  color:var(--dim);font-size:11px}
tr.det .wt th{color:var(--gold);font-weight:600}
.adv{display:none}
table.adv .adv{display:table-cell}
footer{padding:8px 16px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);background:var(--panel)}
</style>
</head>

re","d":10,"s":2.125,"dps":4.71,"r1":1.25}],"am":0,"ar":4,"f":80,"wd":20,"g":20,"st":0,"tot":120,"pop":1,"bt":22.5,"mv":2,"ic":"yuan-raider-4.png","pb":["stable"],"ds":"Extremely swift light cavalry which deals bonus damage to economic units.\n+ Fast move speed\n+ Bonus damage vs Villagers\n- Weak in melee combat\n- Countered by Spearmen\n\nRequires Dynastic Protectors researched at Zhu Xi's Library."}],"civs":{"ab":{"en":"Abbasid Dynasty","jp":"アッバース朝","sh":"アッバース"},"ay":{"en":"Ayyubids","jp":"アイユーブ朝","sh":"アイユーブ"},"by":{"en":"Byzantines","jp":"ビザンツ","sh":"ビザンツ"},"ch":{"en":"Chinese","jp":"中国","sh":"中国"},"de":{"en":"Delhi Sultanate","jp":"デリー・スルタン朝","sh":"デリー"},"en":{"en":"English","jp":"イングランド","sh":"イングランド"},"fr":{"en":"French","jp":"フランス","sh":"フランス"},"gol":{"en":"Golden Horde","jp":"ジョチ・ウルス","sh":"ジョチ"},"hl":{"en":"House of Lancaster","jp":"ランカスター家","sh":"ランカスター"},"hr":{"en":"Holy Roman Empire","jp":"神聖ローマ帝国","sh":"神聖ローマ"},"ja":{"en":"Japanese","jp":"日本","sh":"日本"},"je":{"en":"Jeanne d'Arc","jp":"ジャンヌ・ダルク","sh":"ジャンヌ"},"jin":{"en":"Jin Dynasty","jp":"金朝","sh":"金"},"kt":{"en":"Knights Templar","jp":"テンプル騎士団","sh":"テンプル"},"ma":{"en":"Malians","jp":"マリ","sh":"マリ"},"mac":{"en":"Macedonian Dynasty","jp":"マケドニア朝","sh":"マケドニア"},"mo":{"en":"Mongols","jp":"モンゴル","sh":"モンゴル"},"od":{"en":"Order of the Dragon","jp":"竜の騎士団","sh":"竜騎士団"},"ot":{"en":"Ottomans","jp":"オスマン","sh":"オスマン"},"ru":{"en":"Rus","jp":"ルーシ","sh":"ルーシ"},"sen":{"en":"Sengoku Daimyo","jp":"戦国日本","sh":"戦国"},"tug":{"en":"Tughlaq Dynasty","jp":"トゥグルク朝","sh":"トゥグルク"},"zx":{"en":"Zhu Xi's Legacy","jp":"朱熹の遺産","sh":"朱熹"}}}</script>
<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const U=DB.units, CIV=DB.civs, NCIV=Object.keys(CIV).length;
const WT={melee:'近接',ranged:'遠隔',siege:'攻城',fire:'焼夷'};
const CATS=['歩兵','騎兵','攻城','海軍','宗教','労働者','その他'];
const st={ages:new Set(),cats:new Set(),civ:'',q:'',uq:false,sort:'a',asc:true};

const dmg=u=>u.w?u.w.d:null, spd=u=>u.w?u.w.s:null, dps=u=>u.w?u.w.dps:null;
const rng=u=>(u.w&&u.w.r1&&u.w.r1>=1)?u.w.r1:null;
const wt=u=>u.w?(WT[u.w.t]||u.w.t):'';
const cvsFull=u=>u.cv.map(c=>CIV[c]?CIV[c].jp:c).join('、');
const cvs=u=>u.cv.map(c=>CIV[c]?CIV[c].sh:c).join('・');
const val=(u,k)=>({dmg,dps,spd,rng,wt,cvs}[k]||(x=>x[k]))(u);

function chips(el,items,set,labels){
  items.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=labels?labels[i]:v;
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.classList.toggle('on');render()};
    el.appendChild(b);
  });
}
chips(document.getElementById('ages'),[1,2,3,4],st.ages,['I','II','III','IV']);
chips(document.getElementById('cats'),CATS,st.cats);

const sel=document.getElementById('civ');
sel.innerHTML='<option value="">すべての文明</option>'+Object.keys(CIV)
  .sort((a,b)=>CIV[a].jp.localeCompare(CIV[b].jp,'ja'))
  .map(c=>`<option value="${c}">${CIV[c].jp}</option>`).join('');
sel.onchange=()=>{st.civ=sel.value;render()};
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
document.getElementById('uq').onclick=e=>{st.uq=!st.uq;e.target.classList.toggle('on');render()};
document.getElementById('det').onclick=e=>{document.getElementById('t').classList.toggle('adv');e.target.classList.toggle('on')};
document.getElementById('rst').onclick=()=>location.reload();

document.querySelectorAll('thead th[data-k]').forEach(th=>{
  th.onclick=()=>{
    const k=th.dataset.k;
    if(st.sort===k) st.asc=!st.asc;
    else{st.sort=k; st.asc=['n','cat','cvs','wt','a','bt','tot'].includes(k);}
    render();
  };
});

function filt(){
  return U.filter(u=>{
    if(st.ages.size&&!st.ages.has(u.a))return false;
    if(st.cats.size&&!st.cats.has(u.cat))return false;
    if(st.civ&&u.cv.indexOf(st.civ)<0)return false;
    if(st.uq&&!u.uq)return false;
    if(st.q&&!((u.n||'').toLowerCase().includes(st.q)||cvs(u).includes(st.q)||u.cat.includes(st.q)))return false;
    return true;
  });
}
const n=v=>(v===null||v===undefined||v===''||Number.isNaN(v))?'<span class="z">–</span>':v;
const res=u=>{
  const p=[];
  if(u.f)p.push(`<span class="food">${u.f}</span>`);
  if(u.wd)p.push(`<span class="wood">${u.wd}</span>`);
  if(u.g)p.push(`<span class="gold">${u.g}</span>`);
  if(u.st)p.push(`<span class="stone">${u.st}</span>`);
  return p.length?p.join(''):'<span class="z">–</span>';
};
let VIEW=[];

function render(){
  const rows=filt(), k=st.sort, s=st.asc?1:-1;
  rows.sort((a,b)=>{
    let x=val(a,k),y=val(b,k);
    if(typeof x==='string'||typeof y==='string')
      return String(x||'').localeCompare(String(y||''),'ja')*s||String(a.n).localeCompare(String(b.n));
    if(x==null)x=-Infinity; if(y==null)y=-Infinity;
    return (x-y)*s||(a.a-b.a)||String(a.n).localeCompare(String(b.n));
  });
  VIEW=rows;
  const p90=arr=>{const v=arr.filter(x=>x>0).sort((a,b)=>a-b);return v.length?Math.max(1,v[Math.floor(v.length*0.9)]||v[v.length-1]):1;};
  const mhp=p90(rows.map(u=>u.hp||0));
  const mdps=p90(rows.map(u=>dps(u)||0));
  const pct=(v,m)=>Math.min(100,v/m*100).toFixed(1);
  const byAge=(k==='a');
  let out='',age=null,i=0;
  rows.forEach(u=>{
    if(byAge&&u.a!==age){age=u.a;out+=`<tr class="sec"><td colspan="19">第 ${['','I','II','III','IV'][age]} 時代</td></tr>`;i=0;}
    const cls=(i++%2)?'even':'odd';
    out+=`<tr class="${cls}" data-i="${VIEW.indexOf(u)}">
<td class="sk"><img class="ic" loading="lazy" src="https://data.aoe4world.com/images/units/${u.ic}" onerror="this.style.visibility='hidden'"></td>
<td class="l sk2"><span class="nm">${u.n}</span>${u.uq?'<span class="uq">◆</span>':''}</td>
<td><span class="age v${u.a}">${u.a}</span></td>
<td class="l"><span class="cat">${u.cat}</span></td>
<td class="l"><span class="civ ${u.cv.length>=NCIV-1?'all':''}" title="${cvsFull(u)}">${u.cv.length>=NCIV-1?'全文明':cvs(u)}</span></td>
<td class="bar1">${n(u.hp)}${u.hp?`<i style="width:${pct(u.hp,mhp)}%"></i>`:''}</td>
<td>${n(dmg(u))}</td>
<td class="bar1 bar2">${n(dps(u))}${dps(u)?`<i style="width:${pct(dps(u),mdps)}%"></i>`:''}</td>
<td>${n(rng(u))}</td>
<td class="adv">${n(spd(u))}</td>
<td class="adv l">${wt(u)||'<span class="z">–</span>'}</td>
<td>${u.am||'<span class="z">·</span>'}</td>
<td>${u.ar||'<span class="z">·</span>'}</td>
<td class="l cost">${res(u)}</td>
<td class="adv">${n(u.tot)}</td>
<td>${n(u.bt)}</td>
<td class="adv">${n(u.pop)}</td>
<td>${n(u.mv)}</td><td class="fill"></td></tr>`;
  });
  document.getElementById('tb').innerHTML=out;
  document.getElementById('cnt').textContent=`${rows.length} 件 / 全 ${U.length} 件`;
  document.getElementById('ft').innerHTML=
    `DPS = 攻撃力 ÷ 攻撃間隔。<span class="food">食料</span> <span class="wood">木材</span> <span class="gold">金</span> <span class="stone">石</span>。`+
    `◆ = 文明固有ユニット。対クラス別ダメージボーナス・技術アップグレードは未反映。`;
}

document.getElementById('tb').addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-i]'); if(!tr)return;
  const nx=tr.nextElementSibling;
  if(nx&&nx.classList.contains('det')){nx.remove();tr.classList.remove('open');return;}
  document.querySelectorAll('tr.det').forEach(x=>x.remove());
  document.querySelectorAll('tr.open').forEach(x=>x.classList.remove('open'));
  const u=VIEW[+tr.dataset.i];
  const wtab=u.ws.length?`<table class="wt"><tr><th>武器</th><th>種別</th><th>攻撃</th><th>攻撃間隔</th><th>DPS</th><th>射程</th></tr>`+
    u.ws.map(w=>`<tr><td>${w.n||''}</td><td>${WT[w.t]||w.t}</td><td>${w.d}</td><td>${w.s}</td><td>${w.dps??'–'}</td><td>${(w.r1&&w.r1>=1)?w.r1:'近接'}</td></tr>`).join('')+`</table>`:'';
  const d=document.createElement('tr'); d.className='det';
  d.innerHTML=`<td colspan="19"><b>${u.n}</b> — ${u.dc.join(' / ')}<br>${(u.ds||'').replace(/\n/g,'<br>')}
    <br><b>文明:</b> ${cvsFull(u)}<br><b>生産:</b> ${u.pb.join(', ')||'–'}${wtab}</td>`;
  tr.after(d); tr.classList.add('open');
});

document.getElementById('csv').onclick=()=>{
  const H=['ユニット','時代','分類','文明','HP','攻撃','攻撃種別','射程','攻撃間隔','DPS','近接防','遠隔防','食料','木材','金','石','資源計','人口','生産時間','移動速度'];
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const body=VIEW.map(u=>[u.n,u.a,u.cat,cvsFull(u),u.hp,dmg(u),wt(u),rng(u),spd(u),dps(u),u.am,u.ar,u.f,u.wd,u.g,u.st,u.tot,u.pop,u.bt,u.mv].map(esc).join(','));
  const b=new Blob(['﻿'+[H.join(','),...body].join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='aoe4-units.csv'; a.click();
};
render();
</script>
</body>
</html>
